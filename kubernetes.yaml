apiVersion: v1
kind: Namespace
metadata:
  name: curso-devops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: curso-devops-config
  namespace: curso-devops
data:
  USERNAME: "cmd"
  ENDPOINT: "http://api.google.com/v1"

---
apiVersion: v1
kind: Secret
metadata:
  name: curso-devops-secret
  namespace: curso-devops
type: Opaque
stringData:
  APIKEY: "123456789abcde"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curso-devops-deployment
  namespace: curso-devops
  labels:
    app: curso-devops-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: curso-devops-stack
  template:
    metadata:
      labels:
        app: curso-devops-stack
    spec:
      containers:
      - name: contenedor-curso-devops
        image: carlosmarind/curso-devops-backend
        imagePullPolicy: Always
        env:
        - name: NODE_ENV
          value: development
        - name: PORT
          value: "3000"
        - name: USERNAME
          valueFrom:
            configMapKeyRef:
              name: curso-devops-config
              key: USERNAME
              optional: true
        - name: APIKEY
          valueFrom:
            secretKeyRef:
              name: curso-devops-secret
              key: APIKEY
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"